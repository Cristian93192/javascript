<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nacionalidade</h1>

    País de origem: <input type="text" name="pais" id="pais">
    <input type="button" value="Verificar" onclick="clicar()">
    <div id="res"></div>

    <script>

        function clicar() {

            var p = document.getElementById('pais')
            var r = document.getElementById('res')
            r.innerHTML = `Você mora em ${p}`
            
            
        }

    </script>
</body>
</html>
