<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nacionalidade</h1>

    <p>País de origem: <input type="text" name="pais" id="pais">
    <input type="button" value="Verificar" onclick="clicar()"></p>
    <div id="res"></div>

    <script>
        
        function clicar() {
            var pais = document.getElementById('pais').value;
            var res = document.getElementById('res')
            if (pais == 'Brasil') {
                res.innerHTML = 'Você é brasileiro(a)'
            } else {
                res.innerHTML = 'Você é estrangeiro(a)'
            }
        }

    </script>
</body>
</html>
